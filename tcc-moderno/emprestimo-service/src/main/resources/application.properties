quarkus.application.name=emprestimo-service
quarkus.http.port=8081
quarkus.rest-client.feriado-api.url=https://brasilapi.com.br
quarkus.rest-client.feriado-api.connect-timeout=3000
quarkus.rest-client.feriado-api.read-timeout=3000
quarkus.datasource.db-kind=postgresql
quarkus.datasource.db-version=14
emprestimo.integracao.token=${EMPRESTIMO_INTEGRATION_TOKEN:}
# Credencial exclusiva da leitura de usuarios; nao reutilizar a de comandos.
legado.usuarios.integracao.token=${LEGADO_USUARIOS_INTEGRATION_TOKEN:}
legado.usuarios.allow-local-http=${LEGADO_USUARIOS_ALLOW_LOCAL_HTTP:false}
quarkus.rest-client.legado-usuarios.url=${LEGADO_USUARIOS_URL:https://localhost:8443/monolito-biblioteca}
quarkus.rest-client.legado-usuarios.connect-timeout=3000
quarkus.rest-client.legado-usuarios.read-timeout=3000
quarkus.rest-client.legado-usuarios.follow-redirects=false
quarkus.rest-client.legado-usuarios.logging.scope=none
emprestimo.multas.cron=${EMPRESTIMO_MULTAS_CRON:0 0 0 * * ?}
emprestimo.multas.time-zone=America/Sao_Paulo
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/biblioteca
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=postgres
%prod.quarkus.datasource.jdbc.url=${EMPRESTIMO_DB_URL}
%prod.quarkus.datasource.username=${EMPRESTIMO_DB_USERNAME}
%prod.quarkus.datasource.password=${EMPRESTIMO_DB_PASSWORD}
